<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Morning Dashboard</title>
<style>
  /* ====== EDIT THESE ====== */
  /* Watchlist, ticker tape and stream channels are set in the CONFIG block in the script below. */
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --border: #1f2430;
    --text: #e6e8ee;
    --muted: #8a91a3;
    --accent: #4f8cff;
    --gap: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif; overflow: hidden; }

  .app { height: 100vh; display: grid; gap: var(--gap); padding: var(--gap);
    grid-template-rows: 44px 46px 1.25fr 1fr; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
  .clock { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  .date { color: var(--muted); font-size: 15px; margin-left: 12px; }
  .left { display: flex; align-items: baseline; }
  .streams button { background: var(--panel); color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; margin-left: 6px; }
  .streams button.on { color: var(--text); border-color: var(--accent); }

  .ticker { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }

  .row-top { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); min-height: 0; }
  .row-bottom { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--gap); min-height: 0; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); flex: none; }
  .body { flex: 1; min-height: 0; position: relative; }
  .body > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .tradingview-widget-container, .tradingview-widget-container__widget { width: 100%; height: 100%; }

  #hn { overflow-y: auto; padding: 4px 0; position: absolute; inset: 0; }
  #hn a { display: block; padding: 8px 12px; color: var(--text); text-decoration: none;
    font-size: 13.5px; line-height: 1.35; border-bottom: 1px solid var(--border); }
  #hn a:hover { background: #181c26; }
  #hn .meta { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #hn::-webkit-scrollbar { width: 6px; } #hn::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .note { color: var(--muted); font-size: 12px; padding: 12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="left"><span class="clock" id="clock">--:--</span><span class="date" id="date"></span></div>
    <div class="streams" id="streams"></div>
  </header>

  <div class="ticker" id="ticker"></div>

  <div class="row-top">
    <section class="panel"><h2>Live</h2><div class="body" id="video"></div></section>
    <section class="panel"><h2>S&amp;P 500 Heatmap</h2><div class="body" id="heatmap"></div></section>
  </div>

  <div class="row-bottom">
    <section class="panel"><h2>Watchlist</h2><div class="body" id="watchlist"></div></section>
    <section class="panel"><h2>Market News</h2><div class="body" id="news"></div></section>
    <section class="panel"><h2>Tech Headlines</h2><div class="body"><div id="hn"><p class="note">Loading…</p></div></div></section>
  </div>
</div>

<script>
/* ================= CONFIG: edit freely ================= */
const CONFIG = {
  // Live streams (YouTube channel IDs). The first one plays by default.
  streams: [
    { name: "Yahoo Finance", channel: "UCEAZeUIeJs0IjQiqTCdVSIg" },
    { name: "Bloomberg",     channel: "UCIALMKvObZNtJ6AmdCLP7Lg" }
  ],

  // Your watchlist (TradingView symbols: EXCHANGE:TICKER)
  watchlist: [
    ["NASDAQ:NVDA", "Nvidia"],
    ["NASDAQ:AAPL", "Apple"],
    ["NASDAQ:MSFT", "Microsoft"],
    ["NASDAQ:GOOGL", "Alphabet"],
    ["NASDAQ:META", "Meta"],
    ["NASDAQ:AMZN", "Amazon"],
    ["NASDAQ:TSLA", "Tesla"],
    ["NASDAQ:AMD", "AMD"],
    ["NASDAQ:AVGO", "Broadcom"],
    ["NYSE:TSM", "TSMC"]
  ],

  // Scrolling ticker at the top
  ticker: [
    ["FOREXCOM:SPXUSD", "S&P 500"],
    ["FOREXCOM:NSXUSD", "Nasdaq 100"],
    ["FOREXCOM:DJI", "Dow"],
    ["AMEX:VIXY", "VIX (VIXY)"],
    ["NASDAQ:IEF", "10Y Treasuries (IEF)"],
    ["BITSTAMP:BTCUSD", "Bitcoin"],
    ["TVC:GOLD", "Gold"],
    ["TVC:USOIL", "Oil"]
  ]
};
/* ======================================================= */

// Clock
function tick() {
  const d = new Date();
  document.getElementById("clock").textContent =
    d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  document.getElementById("date").textContent =
    d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
}
tick(); setInterval(tick, 1000);

// Live stream (muted, captions on)
function playStream(i) {
  const s = CONFIG.streams[i];
  const v = document.getElementById("video");
  v.innerHTML = "";
  const f = document.createElement("iframe");
  f.src = `https://www.youtube.com/embed/live_stream?channel=${s.channel}&autoplay=1&mute=1&cc_load_policy=1&controls=0&modestbranding=1`;
  f.allow = "autoplay; encrypted-media; picture-in-picture";
  f.referrerPolicy = "strict-origin-when-cross-origin";
  v.appendChild(f);
  document.querySelectorAll("#streams button").forEach((b, j) => b.classList.toggle("on", j === i));
}
CONFIG.streams.forEach((s, i) => {
  const b = document.createElement("button");
  b.textContent = s.name;
  b.onclick = () => playStream(i);
  document.getElementById("streams").appendChild(b);
});
playStream(0);

// TradingView widget helper
function tv(targetId, widget, config) {
  const host = document.getElementById(targetId);
  const wrap = document.createElement("div");
  wrap.className = "tradingview-widget-container";
  const inner = document.createElement("div");
  inner.className = "tradingview-widget-container__widget";
  wrap.appendChild(inner);
  const sc = document.createElement("script");
  sc.src = `https://s3.tradingview.com/external-embedding/embed-widget-${widget}.js`;
  sc.async = true;
  sc.innerHTML = JSON.stringify(config);
  wrap.appendChild(sc);
  host.appendChild(wrap);
}

tv("ticker", "ticker-tape", {
  symbols: CONFIG.ticker.map(([proName, title]) => ({ proName, title })),
  showSymbolLogo: true, isTransparent: true, displayMode: "adaptive",
  colorTheme: "dark", locale: "en"
});

tv("heatmap", "stock-heatmap", {
  dataSource: "SPX500", grouping: "sector", blockSize: "market_cap_basic",
  blockColor: "change", locale: "en", colorTheme: "dark", hasTopBar: false,
  isDataSetEnabled: false, isZoomEnabled: true, hasSymbolTooltip: true,
  isMonoSize: false, width: "100%", height: "100%"
});

tv("watchlist", "market-overview", {
  colorTheme: "dark", dateRange: "1D", showChart: false, locale: "en",
  isTransparent: true, showSymbolLogo: true, showFloatingTooltip: false,
  width: "100%", height: "100%",
  tabs: [{ title: "Watchlist",
    symbols: CONFIG.watchlist.map(([s, d]) => ({ s, d })) }]
});

tv("news", "timeline", {
  feedMode: "all_symbols", isTransparent: true, displayMode: "regular",
  width: "100%", height: "100%", colorTheme: "dark", locale: "en"
});

// Tech headlines (Hacker News front page)
async function loadHN() {
  const box = document.getElementById("hn");
  try {
    const r = await fetch("https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=30");
    const data = await r.json();
    box.innerHTML = "";
    data.hits.forEach(h => {
      const a = document.createElement("a");
      a.href = h.url || `https://news.ycombinator.com/item?id=${h.objectID}`;
      a.target = "_blank";
      let host = "news.ycombinator.com";
      try { if (h.url) host = new URL(h.url).hostname.replace(/^www\./, ""); } catch (e) {}
      a.innerHTML = `${escapeHTML(h.title)}<span class="meta">${host} · ${h.points} pts</span>`;
      box.appendChild(a);
    });
  } catch (e) {
    box.innerHTML = `<p class="note">Couldn't load headlines. Will retry.</p>`;
  }
}
function escapeHTML(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
loadHN(); setInterval(loadHN, 10 * 60 * 1000);

// Full refresh every 6 hours so nothing goes stale overnight
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
